[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autotune-studio"
version = "0.1.0"
description = "Browser-based LLM fine-tuning studio for Colab, Kaggle and local Jupyter with zero row configuration."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pydantic>=2.6",
  "psutil>=5.9",
  "pyarrow>=15",
  "polars>=0.20",
  "ijson>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
hf = ["datasets>=2.19", "huggingface_hub>=0.23"]
train = ["torch>=2.2", "transformers>=4.43", "peft>=0.11", "trl>=0.9", "accelerate>=0.30"]
gpu = ["unsloth", "bitsandbytes>=0.43", "nvidia-ml-py>=12"]
db = ["sqlalchemy>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
autotune-studio = "autotune_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["autotune_studio"]
artifacts = ["autotune_studio/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 300
markers = [
  "slow: long-running tests (tiny-model training)",
  "network: requires internet access (HF Hub downloads)",
  "gpu: requires CUDA GPU",
]

[tool.ruff]
line-length = 110
target-version = "py310"
